<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/shared.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
       padding: 50px 50px 80px;
       background: var(--burgundy);
    }

    /* ── Header ── */
    .page-01 > :not(.floral-art) { transform: translateY(36px); }
    .header { text-align: center; z-index: 2; margin-top: 10px; }
    .header .the {
      font-family: var(--font-serif);
      font-size: 13px; font-weight: 400;
      letter-spacing: 0.22em;
       color: var(--green-tint);
      text-transform: uppercase;
    }
    .header .title {
      font-family: var(--font-serif);
      font-size: 20px; font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
       color: var(--champagne);
      margin-top: 6px;
    }
    .header .of {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 36px;
       color: var(--gold);
      margin-top: 8px;
    }

    /* ── Couple Names ── */
    .couple {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 52px;
       color: var(--champagne);
      text-align: center;
      z-index: 2;
      line-height: 1.15;
      margin: 2px 0 28px;
    }

    /* ── Envelope ── */
    .envelope-wrap {
      position: relative;
      width: 280px;
      height: 215px;
      z-index: 2;
      margin-bottom: 36px;
    }
    .envelope-wrap > div,
    .envelope-wrap img { display: block; width: 100%; height: 100%; }

    /* ── Date Block ── */
    .date-block { text-align: center; z-index: 2; }
    .date-block .day {
      font-family: var(--font-sans);
      font-size: var(--type-label); font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
       color: var(--gold);
    }
    .date-block .num {
      font-family: var(--font-serif);
      font-size: 72px; font-weight: 300;
       color: var(--champagne);
      line-height: 1;
      margin: 2px 0;
    }
    .date-block .month {
      font-family: var(--font-sans);
      font-size: var(--type-label); font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
       color: var(--green-tint);
    }
    .date-block .year {
      font-family: var(--font-serif);
      font-size: 13px; font-weight: 300;
       color: var(--gold);
      margin-top: 2px;
    }
    .date-block .time {
      font-family: var(--font-sans);
      font-size: var(--type-label); font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--text-mid);
      margin-top: 4px;
    }
  </style>
</head>
<body class="page page-01">
  <div class="floral-art floral-art--top-center" aria-hidden="true"><img src="../assets/page1top.png" alt=""></div>

  <div class="header">
    <div class="the">The</div>
    <div class="title">Holy Matrimony</div>
    <div class="of">of</div>
  </div>

  <div class="couple text-safe">Kingsley<br>&amp;<br>Lawrencia</div>

  <div class="envelope-wrap">
    <div id="envelope-target"><img src="../assets/envelope.png" alt="Tap to view invitation"></div>
  </div>

  <div class="date-block">
    <div class="day">Monday</div>
    <div class="num">14</div>
    <div class="month">September</div>
    <div class="year">2026</div>
    <div class="time">At 10:00 AM</div>
  </div>

</body>
</html>
