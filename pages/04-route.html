<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/shared.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding: 28px 28px 80px;
      background: var(--ivory-tint);
    }

    /* ── Florals ── */
    .floral-l {
      position: absolute; top: 60px; left: -15px;
      width: 130px; height: 200px;
      background: url('../assets/botanical-corner.svg') center / cover no-repeat;
      opacity: 0.38;
      z-index: 1;
    }
    .floral-r {
      position: absolute; top: 60px; right: -15px;
      width: 130px; height: 200px;
      background: url('../assets/botanical-ground.svg') center / cover no-repeat;
      opacity: 0.38;
      z-index: 1;
    }

    .content {
      position: relative; z-index: 2;
      width: 100%; text-align: center;
    }

    /* ── Heading ── */
    .heading {
      font-family: var(--font-serif);
      font-size: var(--type-subheading); font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dark);
      margin-bottom: 22px;
    }

    /* ── Map Card ── */
    .map-card {
      background: var(--bg-white);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(75,24,35,0.1);
      margin-bottom: 16px;
    }
    .map-card .map-visual {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, var(--green-tint) 0%, var(--ivory-deep) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .map-card .map-visual .pin-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .map-card .map-visual .pin-icon {
      width: 28px; height: 28px;
      fill: var(--green-deep);
    }
    .map-card .map-visual .pin-label {
      font-family: var(--font-sans);
      font-size: var(--type-label); font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green-deep);
    }
    .map-card .map-info {
      padding: 12px 14px;
      text-align: center;
    }
    .map-card .map-info .m-name {
      font-family: var(--font-serif);
      font-size: var(--type-subheading); font-weight: 600;
      color: var(--text-dark);
    }
    .map-card .map-info .m-loc {
      font-family: var(--font-sans);
      font-size: var(--type-label); font-weight: 400;
      color: var(--text-mid);
      margin-top: 2px;
    }

    /* ── Actions ── */
    .route-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      width: min(100%, 320px);
      margin: var(--space-lg) auto 0;
      z-index: 2;
      position: relative;
    }

    /* Floral bottom */
    .floral-bot {
      position: absolute; bottom: 60px; left: 0; right: 0;
      height: 80px;
      background: url('../assets/botanical-ground.svg') center / cover no-repeat;
      opacity: 0.25;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="floral-l"></div>
  <div class="floral-r"></div>

  <div class="content">
    <div class="heading">Route to Ceremony Venue</div>

    <div class="map-card">
      <div class="map-visual">
        <div class="pin-wrap">
          <svg class="pin-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          <div class="pin-label text-safe">Wesley Cathedral</div>
        </div>
      </div>
      <div class="map-info">
        <div class="m-name text-safe">Wesley Cathedral</div>
        <div class="m-loc text-safe">Sunyani, Ghana</div>
      </div>
    </div>

    <div class="gold-line"></div>

    <div class="route-actions">
      <button class="action-button action-map pdf-action" id="loc-link" type="button" aria-label="Open venue in Google Maps">Open in Google Maps</button>
    </div>
  </div>

  <div class="floral-bot"></div>

</body>
</html>
