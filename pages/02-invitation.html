<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles/shared.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-2xl);
    }

    .content {
      width: 100%;
      text-align: center;
    }

    .eyebrow,
    .invite {
      font-family: var(--font-sans);
      font-size: var(--type-label);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow {
      color: var(--text-mid);
      margin-bottom: var(--space-xl);
    }

    .name {
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--text-dark);
    }

    .and {
      font-family: var(--font-serif);
      font-size: var(--type-body);
      font-style: italic;
      color: var(--burgundy);
      margin: var(--space-xs) 0;
    }

    .invite {
      color: var(--burgundy);
      line-height: 1.6;
      margin-top: var(--space-2xl);
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="eyebrow">Together with their families</div>
    <div class="name text-safe">Kingsley Asare Baafi</div>
    <div class="and">and</div>
    <div class="name text-safe">Lawrencia Smith</div>
    <div class="invite">Invite you to their wedding<br>celebration</div>
  </div>
</body>
</html>
